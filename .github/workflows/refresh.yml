name: Battery EMD price refresh

on:
  schedule:
    # GitHub silently drops many scheduled runs (~2 of 4/day landed
    # 2026-11-21..24). A second offset slot keeps snapshot density up;
    # the concurrency group below stops overlap. Max 8 runs/day x 4 Vercel
    # projects stays well under Hobby's daily deployment limit.
    - cron: "17 */6 * * *"
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices
        run: python3 pipeline/fetch_prices.py

      - name: Refresh Vatrer prices from Awin feed (no-op until secret is set)
        env:
          AWIN_VATRER_FEED_URL: ${{ secrets.AWIN_VATRER_FEED_URL }}
        run: python3 pipeline/awin_feed.py

      - name: Rebuild sites
        run: python3 pipeline/build_sites.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "Jaycub Giebel"
          git config user.email "magicwifimoney@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Price refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
