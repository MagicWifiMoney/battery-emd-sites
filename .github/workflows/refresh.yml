name: Refresh prices and rebuild site

# Stage A automation: poll maker stores 4x/day, rebuild the static site, and
# commit the fresh snapshot back to the repo. The commit matters twice:
# it is the audit trail for every price snapshot, AND it keeps this scheduled
# workflow alive — GitHub disables scheduled workflows in repos with no
# activity for 60 days, and the snapshot commit counts as activity.
# Cron is set 17 minutes past the hour because GitHub delays/drops
# top-of-the-hour schedules.

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch maker-store prices
        run: python3 pipeline/fetch_prices.py

      - name: Build static site
        run: python3 pipeline/build_site.py

      - name: Commit fresh snapshot
        run: |
          git config user.name "battery-per-wh bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json data/fetch_log.json dist/index.html
          git diff --cached --quiet || git commit -m "Price refresh $(date -u +%FT%TZ)"
          git push

